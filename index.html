<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Doces e Travessuras - Cardápio & Delivery</title>
        <!-- CSS Principal -->
        <link rel="stylesheet" href="css/estilo.css">
        <!-- Supabase JS Client via CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>

        <!-- Cabeçalho -->
        <header class="header">
            <div class="logo">
                <h1>🍰 Doces e Travessuras</h1>
                <p>Cardápio & Delivery</p>
            </div>
            <button class="cart-btn" onclick="toggleCarrinho()">
                🛒 Carrinho (<span id="cart-count">0</span>)
            </button>
        </header>

        <!-- Banner de Status da Loja -->
        <div id="store-status-banner" class="status-banner" style="display: none;"></div>

        <!-- Filtro de Categorias -->
        <nav class="categories-nav" id="categories-container">
            <button class="cat-btn active" onclick="filtrarCategoria('todas')">Todas</button>
        </nav>

        <!-- Grade de Produtos -->
        <main class="container">
            <section class="products-grid" id="products-container">
                <!-- Produtos serão inseridos via JavaScript -->
            </section>
        </main>

        <!-- Modal / Gaveta do Carrinho -->
        <div class="modal-overlay" id="cart-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Seu Pedido</h2>
                    <button class="close-btn" onclick="toggleCarrinho()">&times;</button>
                </div>

                <div class="modal-body">
                    <div id="cart-items">
                        <p class="empty-cart">Seu carrinho está vazio.</p>
                    </div>

                    <div class="cart-summary" id="cart-summary" style="display: none;">
                        <div class="summary-line">
                            <span>Subtotal:</span>
                            <span id="subtotal-val">R$ 0,00</span>
                        </div>
                        <div class="summary-line">
                            <span>Taxa de Entrega:</span>
                            <span id="taxa-val">R$ 5,00</span>
                        </div>
                        <div class="summary-line total">
                            <strong>Total:</strong>
                            <strong id="total-val">R$ 0,00</strong>
                        </div>

                        <!-- Formulário de Checkout -->
                        <form id="checkout-form" onsubmit="finalizarPedido(event)">
                            <h3>Dados de Entrega</h3>

                            <div class="form-group">
                                <label>Tipo de Pedido:</label>
                                <select id="tipo_pedido" onchange="atualizarTaxa()">
                                    <option value="DELIVERY">Delivery (Entrega na casa)</option>
                                    <option value="RETIRADA">Retirada (Retira na Loja</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <input type="text" id="cli_nome" placeholder="Seu Nome Completo" required>
                            </div>

                            <div class="form-group">
                                <label for="cli_telefone">Telefone *</label>

                                <input
                                    type="tel"
                                    id="cli_telefone"
                                    class="input-table"
                                    placeholder="(18) 99999-9999"
                                    maxlength="15"
                                    inputmode="numeric"
                                    autocomplete="tel"
                                    required
                                    oninput="formatarTelefone(this)"
                                    >
                            </div>

                            <div id="endereco-section">
                                <div class="form-group">
                                    <label for="cli_cidade">Cidade *</label>
                                    <select id="cli_cidade" class="input-table" required onchange="selecionarCidadeEntrega()">
                                        <option value="">Carregando cidades...</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <input type="text" id="cli_rua" placeholder="Rua / Avenida" required>
                                    <input type="text" id="cli_numero" placeholder="Nº" style="width: 80px;" required>
                                </div>
                                <div class="form-row">
                                    <input type="text" id="cli_bairro" placeholder="Bairro" required>
                                    <input type="text" id="cli_complemento" placeholder="Apto / Bloco (Opcional)">
                                </div>
                                <div class="form-group">
                                    <input type="text" id="cli_referencia" placeholder="Ponto de Referência">
                                </div>
                            </div>

                            <h3>Pagamento</h3>
                            <div class="form-group">
                                <select id="forma_pagamento" onchange="toggleTroco()" required>
                                    <option value="PIX">Pix</option>
                                    <option value="DINHEIRO">Dinheiro</option>
                                    <!--     <option value="CARTAO_CREDITO">Cartão de Crédito (Na entrega)</option>
                                             <option value="CARTAO_DEBITO">Cartão de Débito (Na entrega)</option>      -->
                                </select>
                            </div>

                            <div class="form-group" id="troco-group" style="display: none;">
                                <input type="number" step="0.01" id="troco_para" placeholder="Troco para quanto? (ex: 50.00)">
                            </div>

                            <div class="form-group">
                                <textarea id="observacao" placeholder="Observações do pedido"></textarea>
                            </div>

                            <div
                                class="form-group"
                                id="whatsapp-notificacao-group"
                                style="display: none;"
                                >
                                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                    <input
                                        type="checkbox"
                                        id="notificar_whatsapp"
                                        style="width: 18px; height: 18px; cursor: pointer;"
                                        >
                                    <span>
                                        📱 Quero receber atualizações do meu pedido pelo WhatsApp
                                    </span>
                                </label>
                            </div>

                            <button type="submit" class="submit-btn" id="btn-submit">Enviar Pedido</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
